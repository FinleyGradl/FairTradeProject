services:
  db:
    build: ./db 
    restart: unless-stopped
    environment:
      POSTGRES_USER: fairtrade
      POSTGRES_PASSWORD: fairtrade
      POSTGRES_DB: fairtrade
    expose:
      - 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairtrade -d fairtrade"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      nginxproxy:
        ipv4_address: 172.25.0.237

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - 3000
    environment:
      NODE_ENV: production
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://fairtrade:fairtrade@172.25.0.237:5432/fairtrade"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads
    networks:
      nginxproxy:
        ipv4_address: 172.25.0.236

volumes:
  pgdata:
  uploads:


networks:
  nginxproxy:
    external: true